<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Agenda do salão{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --fundo: #F5EFF2;
            --superficie: #FFFFFF;
            --tinta: #2B1D2F;
            --tinta-suave: #6E6073;
            --linha: #E6DBE1;
            --ameixa: #5E2750;
            --ameixa-escura: #471C3D;
            --orquidea: #B4558C;
            --agendado-fundo: #F3E4EE;
            --salvia: #3F7A64;
            --salvia-fundo: #E1EFE8;
            --cancelado: #8C8191;
            --cancelado-fundo: #ECE8EE;
            --erro: #B3261E;
            --erro-fundo: #FBE9E7;
            --fonte-titulo: 'Bricolage Grotesque', 'Segoe UI', sans-serif;
            --fonte-texto: 'Figtree', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--fundo);
            color: var(--tinta);
            font-family: var(--fonte-texto);
            font-size: 1rem;
            line-height: 1.55;
        }

        
        .topo { background: var(--ameixa); }
        .topo__interno {
            max-width: 960px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .marca {
            font-family: var(--fonte-titulo);
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: -0.01em;
            color: #fff;
            text-decoration: none;
        }
        .menu { display: flex; gap: 6px; flex-wrap: wrap; }
        .menu a {
            color: #F1DDEA;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: 500;
            transition: background 0.15s;
        }
        .menu a:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
        .menu a.destaque { background: #fff; color: var(--ameixa); font-weight: 600; }
        .menu a.destaque:hover { background: #F6E6F0; }
        .topo a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

    
        main { max-width: 960px; margin: 0 auto; padding: 36px 20px 64px; }

        h1 {
            font-family: var(--fonte-titulo);
            font-weight: 700;
            font-size: 2.2rem;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin: 0;
        }
        .cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .subtitulo { color: var(--tinta-suave); margin: 6px 0 0; }

    
        .botao {
            display: inline-block;
            background: var(--ameixa);
            color: #fff;
            border: 0;
            border-radius: 12px;
            padding: 12px 22px;
            font: 600 1rem var(--fonte-texto);
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s;
        }
        .botao:hover { background: var(--ameixa-escura); }
        .botao--secundario {
            background: transparent;
            color: var(--ameixa);
            padding: 12px 16px;
        }
        .botao--secundario:hover { background: var(--agendado-fundo); }

        
        .msg {
            background: var(--salvia-fundo);
            color: #234B3B;
            border-left: 5px solid var(--salvia);
            border-radius: 10px;
            padding: 12px 16px;
            margin: 0 0 20px;
            font-weight: 500;
        }

        /* Agenda */
        .dia h2 {
            font-family: var(--fonte-titulo);
            font-weight: 500;
            font-size: 1.15rem;
            color: var(--ameixa);
            margin: 34px 0 12px;
        }
        .dia h2::first-letter { text-transform: uppercase; }

        .agenda { list-style: none; margin: 0; padding: 0; }
        .item {
            display: grid;
            grid-template-columns: 88px 1fr auto;
            gap: 20px;
            align-items: center;
            background: var(--superficie);
            border: 1px solid var(--linha);
            border-left: 6px solid var(--orquidea);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 10px;
        }
        .item--concluido { border-left-color: var(--salvia); }
        .item--cancelado { border-left-color: var(--cancelado); }
        .item--cancelado .detalhe strong { text-decoration: line-through; color: var(--tinta-suave); }

        .hora {
            font-family: var(--fonte-titulo);
            font-weight: 700;
            font-size: 1.7rem;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
        }
        .detalhe strong { display: block; font-size: 1.05rem; }
        .detalhe span { color: var(--tinta-suave); }

        .selo {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            background: var(--agendado-fundo);
            color: var(--ameixa);
            white-space: nowrap;
        }
        .selo--concluido { background: var(--salvia-fundo); color: #234B3B; }
        .selo--cancelado { background: var(--cancelado-fundo); color: #5E5463; }

        .vazio {
            background: var(--superficie);
            border: 1px dashed #CDBFC8;
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
            margin-top: 28px;
        }
        .vazio p { margin: 0 0 16px; color: var(--tinta-suave); }
        .cartao {
            max-width: 560px;
            background: var(--superficie);
            border: 1px solid var(--linha);
            border-radius: 18px;
            padding: 28px;
            margin-top: 24px;
        }
        .cartao p { display: grid; gap: 6px; margin: 0 0 18px; }
        .cartao label { font-weight: 600; font-size: 0.92rem; }
        .cartao input,
        .cartao select,
        .cartao textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #CDBFC8;
            border-radius: 10px;
            background: #fff;
            color: var(--tinta);
            font: 400 1rem var(--fonte-texto);
        }
        .cartao textarea { min-height: 96px; resize: vertical; }
        .cartao input:focus,
        .cartao select:focus,
        .cartao textarea:focus { border-color: var(--ameixa); }
        .cartao .errorlist {
            list-style: none;
            margin: 0 0 14px;
            padding: 10px 14px;
            background: var(--erro-fundo);
            color: var(--erro);
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 500;
        }
        .cartao p .errorlist { margin: 0; }
        .acoes { display: flex; align-items: center; gap: 8px; margin-top: 8px; }

        a:focus-visible, button:focus-visible,
        input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 3px solid var(--orquidea);
            outline-offset: 2px;
        }

        @media (max-width: 560px) {
            h1 { font-size: 1.8rem; }
            .item { grid-template-columns: 72px 1fr; gap: 6px 14px; padding: 14px 16px; }
            .selo { grid-column: 2; justify-self: start; }
            .cartao { padding: 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <header class="topo">
        <div class="topo__interno">
            <a class="marca" href="{% url 'lista_agendamentos' %}">Seu Salão</a>
            <nav class="menu">
                <a href="{% url 'lista_agendamentos' %}">Agenda</a>
                <a href="/admin/">Administração</a>
                <a class="destaque" href="{% url 'novo_agendamento' %}">Novo agendamento</a>
            </nav>
        </div>
    </header>

    <main>
        {% for m in messages %}<div class="msg" role="status">{{ m }}</div>{% endfor %}
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
